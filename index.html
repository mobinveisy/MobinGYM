function safeLoad(){for(const key of ['mobingym_v2','mobingym_backup_v2'])try{const raw=localStorage.getItem(key);if(raw){const s=JSON.parse(raw);if(s&&s.version===2&&s.sessions){return {...structuredClone(BASE),...s,profile:{...BASE.profile,...s.profile},schedule:{...BASE.schedule,...s.schedule},nutrition:s.nutrition||{},weights:s.weights||[]}}}}catch(e){}return structuredClone(BASE)}

function isoByZone(date=new Date()){const f=new Intl.DateTimeFormat('en-US',{timeZone:state.profile.timezone||'Asia/Tehran',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(date);const ob=Object.fromEntries(f.filter(x=>x.type!=='literal').map(x=>[x.type,x.value]));return `${ob.year}-${ob.month}-${ob.day}`}
function isoDay(iso,add){const d=new Date(`${iso}T12:00:00Z`);d.setUTCDate(d.getUTCDate()+add);return d.toISOString().slice(0,10)}
function dayOf(iso){return new Date(`${iso}T12:00:00Z`).getUTCDay()}
function jalali(iso,opts={year:'numeric',month:'long',day:'numeric'}){return new Intl.DateTimeFormat('fa-IR-u-ca-persian',{...opts,timeZone:'UTC'}).format(new Date(`${iso}T12:00:00Z`))}
function jpart(iso){const parts=new Intl.DateTimeFormat('en-US-u-ca-persian',{year:'numeric',month:'numeric',day:'numeric',timeZone:'UTC'}).formatToParts(new Date(`${iso}T12:00:00Z`));return Object.fromEntries(parts.filter(x=>x.type!=='literal').map(x=>[x.type,Number(x.value)]))}
function weekStart(iso){return isoDay(iso,-((dayOf(iso)+1)%7))}
function weekLogs(iso){const start=weekStart(iso),end=isoDay(start,6);return Object.entries(state.sessions).filter(([d,s])=>d>=start&&d<=end&&s.finishedAt)}
const today=()=>isoByZone();

if(!state.createdAt){state.createdAt=today();save()}
function lastCompleted(){return Object.entries(state.sessions).filter(([,s])=>s.finishedAt).sort((a,b)=>b[0].localeCompare(a[0]))[0]?.[1]||null}
function recommend(){const d=today(),current=state.sessions[d];if(current)return current.plan;const done=weekLogs(d).map(([,s])=>s.plan);const previous=lastCompleted();if(previous){const next=ORDER[(ORDER.indexOf(previous.plan)+1)%4];if(!done.includes(next))return next;}const assigned=state.schedule[dayOf(d)];if(assigned&&!done.includes(assigned))return assigned;return ORDER.find(x=>!done.includes(x))||ORDER[0]}
function currentSession(){return state.sessions[today()]}
function progress(s){if(!s)return {done:0,total:0,percent:0};const p=plans[s.plan];const total=p.ex.reduce((a,e)=>a+e[2],0);const done=Object.values(s.sets||{}).filter(x=>x.done).length;return {total,done,percent:Math.round(done/total*100)}}
function newSession(plan){return {date:today(),plan,startedAt:Date.now(),finishedAt:null,sets:{},note:''}}
function notify(){render();save()}
function goto(next){tab=next;openEx=null;window.scrollTo({top:0,behavior:'smooth'});render()}
function toast(msg){const root=document.getElementById('toastRoot');root.innerHTML=`<div class="toast">${escapeHTML(msg)}</div>`;clearTimeout(toastTimer);toastTimer=setTimeout(()=>root.innerHTML='',3000)}
function weekDates(){const start=weekStart(today());return Array.from({length:7},(_,i)=>isoDay(start,i))}
function completedCount(){return weekLogs(today()).length}
function streak(){const ends=new Set(Object.entries(state.sessions).filter(([,s])=>s.finishedAt).map(([d])=>d));let w=weekStart(today()),n=0;for(let i=0;i<52;i++){let count=0;for(let j=0;j<7;j++)if(ends.has(isoDay(w,j)))count++;if(count===0)break;n++;w=isoDay(w,-7)}return n}

function sessionPage(){const active=currentSession();const plan=active?.plan||selectedPlan||recommend();const p=plans[plan],s=active&&active.plan===plan?active:null;const calc=progress(s||{plan,sets:{}});const isDone=!!s?.finishedAt;return `${pageHeader('TRAINING SESSION','وقت ساختن نسخه قوی‌ترته.','ست به ست پیش برو؛ وزنه و تکرار واقعی هر حرکت رو ثبت کن.',`<button class="btn outline btn-sm" data-open="choose">${ic('edit','sm')} انتخاب جلسه</button>`)}<div class="session-top"><div class="session-tabs">${ORDER.map(id=>`<button class="session-tab ${plan===id?'selected':''}" data-select-plan="${id}"><b>${id}</b><i>${id==='A'||id==='C'?'بالاتنه':'پایین‌تنه'}</i></button>`).join('')}</div><span class="pill">${ic('calendar','tiny')} ${escapeHTML(jalali(today()))}</span></div><div class="card session-summary"><div><span class="eyebrow">${p.tag}</span><h2>${p.title} <span style="color:#73c1ff">· ${p.subtitle}</span></h2><p>${num(p.ex.length)} حرکت · ${num(p.ex.reduce((a,e)=>a+e[2],0))} ست · حدود ${num(p.mins)} دقیقه</p><div class="chip-row mt12"><span class="chip">${ic('clock','tiny')} استراحت کنترل‌شده</span><span class="chip">${ic('target','tiny')} RIR: ۱ تا ۳</span><span class="chip">${s?'در حال ثبت':'آماده شروع'}</span></div></div><div class="ring"><svg viewBox="0 0 96 96"><circle cx="48" cy="48" r="39" class="ring-bg"/><circle cx="48" cy="48" r="39" class="ring-fg" stroke-dasharray="245.04" stroke-dashoffset="${245.04*(1-calc.percent/100)}"/></svg><b>${num(calc.percent)}٪</b></div></div>${isDone?`<div class="done-ribbon">${ic('check')} این جلسه در تاریخ ${escapeHTML(jalali(today()))} ثبت شده. برای اصلاح ست‌ها می‌تونی دوباره بازش کنی. <button class="btn btn-sm outline" data-reopen="1" style="margin-right:10px">ویرایش</button></div>`:''}<div class="exercise-list">${p.ex.map((e,i)=>exerciseCard(e,i,s)).join('')}</div><div class="session-footer"><div><strong>${num(calc.done)} / ${num(calc.total)} ست ثبت شده</strong><small>${isDone?'تمرین امروز ذخیره شده':s?'هر تیک خودکار ذخیره می‌شه':'با اولین ثبت، تمرین امروز ساخته می‌شه'}</small></div><button class="btn ${isDone?'outline':'green'}" data-finish="1">${ic(isDone?'check':'trophy','sm')}${isDone?'جلسه ثبت شده':'پایان و ثبت جلسه'}</button></div>`}
function exerciseCard(e,i,s){const [id,name,sets,reps,rest,type,cue]=e;const opened=openEx===id;const checked=Array.from({length:sets},(_,n)=>s?.sets?.[`${id}:${n}`]?.done);return `<div class="card exercise ${opened?'open':''}" id="ex-${id}"><div class="exercise-main" data-ex="${id}"><div class="exercise-art">${pic(type)}</div><div class="exercise-meta"><h3 class="exercise-title">${num(i+1)}. ${escapeHTML(name)}</h3><div class="exercise-desc">${num(sets)} ست × ${fi(reps)} تکرار · استراحت ${num(rest)} ثانیه</div><div class="exercise-checks">${checked.map((d,n)=>`<span class="set-mini ${d?'done':''}">${d?ic('check','tiny'):num(n+1)}</span>`).join('')}</div></div><button class="link-btn" data-preview="${id}" aria-label="نمایش راهنمای ${escapeHTML(name)}">${ic('play','sm')}</button><span class="exercise-chevron">${ic('chevron','sm')}</span></div>${opened?`<div class="exercise-detail"><div class="between" style="margin-bottom:13px"><strong style="font-size:12px">ثبت ست‌ها</strong><button class="link-btn" data-preview="${id}">نمایش انیمیشن حرکت ${ic('play','tiny')}</button></div><div class="set-table set-head"><span>ست</span><span>وزنه (کیلو)</span><span>تکرار واقعی</span><span>وضعیت</span></div>${Array.from({length:sets},(_,n)=>{const set=s?.sets?.[`${id}:${n}`]||{};return `<div class="set-table"><div class="set-number">${num(n+1)}</div><input class="field" type="number" min="0" max="999" step="0.5" inputmode="decimal" placeholder="—" value="${escapeHTML(set.weight??'')}" data-set-field="weight" data-exid="${id}" data-set="${n}" aria-label="وزنه ست ${n+1}"/><input class="field" type="number" min="0" max="100" inputmode="numeric" placeholder="${fi(reps.split('–')[0].replace(/[^0-9۰-۹]/g,''))}" value="${escapeHTML(set.reps??'')}" data-set-field="reps" data-exid="${id}" data-set="${n}" aria-label="تکرار ست ${n+1}"/><button class="set-done ${set.done?'done':''}" data-set-done="${id}:${n}">${ic('check','tiny')}${set.done?'انجام':'ثبت'}</button></div>`}).join('')}<div class="tip">${ic('info','sm')} <span>${escapeHTML(cue)}<br/>این انیمیشن شماتیکه؛ فرم صحیح را با مربی یا ویدئوی معتبر بررسی کن.</span></div></div>`:''}</div>`}
function nutritionDay(){const d=today();if(!state.nutrition[d])state.nutrition[d]={water:0,checked:{},options:{}};return state.nutrition[d]}
function getMeal(m){return m.choices[nutritionDay().options[m.id]||0]}
function consumed(){let k=0,p=0,c=0,f=0;for(const m of MEALS){if(nutritionDay().checked[m.id]){let v=getMeal(m);k+=v.k;p+=v.p;c+=v.c;f+=v.f}}return {k,p,c,f}}
function macroCard(icon,name,value,target,unit,color){return `<div class="card macro-stat"><div class="between"><small>${name}</small><span style="color:${color}">${ic(icon,'sm')}</span></div><strong>${num(value)} <span style="font-size:10px;color:#849eb9;font-weight:500">/ ${num(target)} ${unit}</span></strong><div class="mini-track"><span style="width:${Math.min(100,value/Math.max(1,target)*100)}%;background:${color}"></span></div></div>`}
function nutritionPage(){const daily=nutritionDay(),tot=consumed(),target=state.profile;return `${pageHeader('NUTRITION PLAN','تغذیه؛ سوخت پیشرفتت.','برنامه غذایی نمونه برای فاز کاهش چربی، با ثبت وعده‌ها و محاسبه تقریبی درشت‌مغذی‌ها.',`<button class="btn outline btn-sm" data-tab="settings">${ic('edit','sm')} تنظیم اهداف</button>`)}<div class="macro-grid">${macroCard('fire','کالری مصرف‌شده',tot.k,target.calories,'kcal','#48aeff')}${macroCard('dumbbell','پروتئین',tot.p,target.protein,'g','#53e0b3')}${macroCard('trend','کربوهیدرات',tot.c,target.carbs,'g','#b694fa')}${macroCard('water','چربی',tot.f,target.fat,'g','#ffca75')}</div><div class="card card-in mt20"><div class="between"><div><div class="eyebrow">DAILY NUTRITION PROGRESS</div><h2 style="font-size:17px;margin:3px 0">پیشرفت تغذیه امروز</h2><p class="sub" style="margin:0">${escapeHTML(jalali(today()))} · ${num(Object.values(daily.checked).filter(Boolean).length)} وعده ثبت شده</p></div><strong style="font-size:26px">${num(Math.round(tot.k/target.calories*100))}٪</strong></div><div class="progress-track mt16"><div class="progress-fill" style="width:${Math.min(100,tot.k/target.calories*100)}%"></div></div></div><div class="section-head mt20"><h2>وعده‌های پیشنهادی</h2><small>برای ثبت مصرف، روی «خوردم» بزن</small></div><div class="meals">${MEALS.map(m=>{const food=getMeal(m),done=daily.checked[m.id];return `<div class="card meal"><div class="meal-head"><div class="meal-icon">${m.emoji}</div><div><h3>${m.title}</h3><div class="meal-time">حدود ${fi(m.time)} · ${food.name}</div></div></div><p class="meal-content">${food.items}</p><div class="meal-chips"><span class="macro-chip">${num(food.k)} کالری</span><span class="macro-chip">پروتئین ${num(food.p)}g</span><span class="macro-chip">کربوهیدرات ${num(food.c)}g</span><span class="macro-chip">چربی ${num(food.f)}g</span></div><div class="meal-actions"><button class="btn btn-sm ${done?'green':'primary'}" data-meal="${m.id}">${ic('check','tiny')} ${done?'ثبت شد ✓':'خوردم · ثبت کن'}</button><button class="link-btn" data-swap-meal="${m.id}">${ic('rotate','tiny')} جایگزین غذا</button></div></div>`}).join('')}</div><div class="grid-2 mt20"><div class="card card-in"><div class="section-head"><h2>${ic('water','sm')} ثبت آب روزانه</h2><span class="chip">هر لیوان حدود ۲۵۰ میلی‌لیتر</span></div><div class="between"><strong style="font-size:23px">${num(daily.water)} <small class="sub">از ${num(target.water)} لیوان</small></strong><div style="display:flex;gap:8px"><button class="water-btn" data-water="-1" aria-label="کم کردن لیوان">−</button><button class="water-btn" data-water="1" aria-label="افزودن لیوان">+</button></div></div><div class="water-bubbles">${Array.from({length:Math.max(1,Math.min(16,target.water))},(_,i)=>`<div class="water-bubble ${i<daily.water?'filled':''}"></div>`).join('')}</div><div class="sub">نیاز واقعی آب به تعریق، گرما و میزان فعالیت بستگی داره؛ عدد بالا صرفاً یک هدف قابل ویرایشه.</div></div><div class="card card-in"><div class="section-head"><h2>${ic('info','sm')} راهنمای تغذیه</h2></div><div class="sub">هدف کالری نقطه شروع آزمایشی است، نه نسخه پزشکی. حجم مواد غذایی و برچسب محصول رو بررسی کن. اعداد غذایی تقریبی‌اند و به روش پخت و نوع محصول وابسته‌اند. هدف اصلی کاهش وزن تدریجی همراه با حفظ قدرت و دریافت پروتئین کافیه.</div></div></div><div class="food-note">${ic('shield','sm')} اگر بیماری زمینه‌ای، دارو، حساسیت غذایی یا محدودیت پزشکی داری، برنامه غذایی باید متناسب با اون تنظیم بشه. به‌خصوص در صورت مصرف لووتیروکسین، زمان مصرف دارو و فاصله آن از غذا و مکمل‌ها را با پزشک یا داروساز هماهنگ کن.</div>`}
function monthGrid(){const base=isoDay(today(),calendarOffset*29),j=jpart(base);let start=isoDay(base,-(j.day-1));let days=[];for(let i=0;i<32;i++){let d=isoDay(start,i),v=jpart(d);if(v.month!==j.month||v.year!==j.year)break;days.push(d)}let off=(dayOf(start)+1)%7;return `<div class="calendar-month"><button class="btn btn-sm outline" data-cal-nav="-1" aria-label="ماه قبل">${ic('arrow','tiny')}</button><strong>${escapeHTML(jalali(start,{month:'long',year:'numeric'}))}</strong><button class="btn btn-sm outline" data-cal-nav="1" aria-label="ماه بعد" style="transform:rotate(180deg)">${ic('arrow','tiny')}</button></div><div class="calendar-grid">${shortDays.map(x=>`<div class="cal-head">${x}</div>`).join('')}${Array.from({length:off},()=>'<div class="cal-cell empty"></div>').join('')}${days.map(d=>{const log=state.sessions[d];return `<div class="cal-cell ${d===today()?'today':''} ${log?(log.finishedAt?'finished':'logged'):''}" title="${escapeHTML(jalali(d))}${log?' | '+plans[log.plan].title:''}">${fi(jpart(d).day)}</div>`}).join('')}</div><div class="chip-row mt16"><span class="chip">🟢 جلسه ثبت‌شده</span><span class="chip">🔵 جلسه نیمه‌تمام</span></div>`}
function weightChart(){const data=state.weights.slice(-12);if(data.length===0)return `<div class="empty-state">${ic('trend','lg')}<div>وزن جدید رو ثبت کن تا نمودار روندت ساخته بشه.</div></div>`;const vals=data.map(x=>Number(x.weight)),mn=Math.min(...vals,Number(state.profile.goal))-2,mx=Math.max(...vals)+2;const coords=data.map((e,i)=>{const x=data.length===1?50:35+i*(460/(data.length-1)),y=175-(Number(e.weight)-mn)/(mx-mn)*145;return [x,y]});const points=coords.map(p=>p.join(',')).join(' ');return `<svg class="chart-svg" viewBox="0 0 530 205" preserveAspectRatio="none"><defs><linearGradient id="chartgrad" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#289fff" stop-opacity=".31"/><stop offset="1" stop-color="#289fff" stop-opacity="0"/></linearGradient></defs>${[0,1,2,3].map(i=>`<line x1="35" y1="${25+i*50}" x2="505" y2="${25+i*50}" stroke="#36516a" stroke-dasharray="3 6" opacity=".35"/>`).join('')}<polygon points="${points} ${coords.at(-1)[0]},180 ${coords[0][0]},180" fill="url(#chartgrad)"/><polyline points="${points}" fill="none" stroke="#4bbcff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>${coords.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="5" fill="#8de8ff" stroke="#143e6c" stroke-width="3"/><text x="${p[0]}" y="${p[1]-14}" text-anchor="middle" fill="#b7e7ff">${fi(vals[i])}</text>`).join('')}</svg><div class="between sub"><span>${escapeHTML(jalali(data[0].date,{month:'short',day:'numeric'}))}</span><span>${escapeHTML(jalali(data.at(-1).date,{month:'short',day:'numeric'}))}</span></div>`}
function historyPage(){const logs=Object.entries(state.sessions).sort((a,b)=>b[0].localeCompare(a[0]));const done=logs.filter(([,s])=>s.finishedAt).length;return `${pageHeader('PERFORMANCE ARCHIVE','هر قدمت، یک رکورد ماندگار.','جلسات، وزن و پیشرفتت با تاریخ دقیق در دستگاهت ذخیره شده‌اند.',`<button class="btn outline btn-sm" data-export="1">${ic('download','sm')} دریافت نسخه پشتیبان</button>`)}<div class="stats-grid"><div class="card stat"><div class="stat-icon">${ic('dumbbell','lg')}</div><div><div class="stat-label">جلسات کامل</div><div class="stat-value">${num(done)}</div></div></div><div class="card stat"><div class="stat-icon green">${ic('check','lg')}</div><div><div class="stat-label">ست‌های انجام‌شده</div><div class="stat-value">${num(logs.reduce((a,[,s])=>a+Object.values(s.sets||{}).filter(x=>x.done).length,0))}</div></div></div><div class="card stat"><div class="stat-icon purple">${ic('calendar','lg')}</div><div><div class="stat-label">این هفته</div><div class="stat-value">${num(completedCount())} <small>جلسه</small></div></div></div><div class="card stat"><div class="stat-icon gold">${ic('weight','lg')}</div><div><div class="stat-label">وزن آخر</div><div class="stat-value">${num(state.weights.at(-1)?.weight||state.profile.weight)} <small>kg</small></div></div></div></div><div class="history-grid"><div class="card calendar">${monthGrid()}</div><div class="card card-in"><div class="section-head"><h2>تاریخچه تمرین‌ها</h2><small>${num(logs.length)} روز دارای اطلاعات</small></div><div class="history-list">${logs.length?logs.map(([date,s])=>{const p=progress(s);return `<div class="history-row"><div class="history-id">${s.plan}</div><div style="flex:1"><strong>${plans[s.plan]?.title||s.plan} · ${escapeHTML(jalali(date))}</strong><small>${num(p.done)} از ${num(p.total)} ست · ${s.finishedAt?'تکمیل شده':'نیمه‌تمام'} ${s.finishedAt&&s.startedAt?' · '+num(Math.round((s.finishedAt-s.startedAt)/60000))+' دقیقه':''}</small></div><span style="color:${s.finishedAt?'#48e5ac':'#72b9ff'}">${ic(s.finishedAt?'check':'clock','sm')}</span></div>`}).join(''):`<div class="empty-state">${ic('calendar','lg')}<div>هنوز جلسه‌ای ثبت نشده. اولین تمرینت رو شروع کن!</div></div>`}</div></div></div><div class="grid-2 mt20"><div class="card chart-card"><div class="section-head"><h2>نمودار تغییر وزن</h2><small>هدف: ${num(state.profile.goal)} کیلوگرم ${state.weights.at(-1)?.waist?' · دور کمر: '+num(state.weights.at(-1).waist)+' سانتی‌متر':''}</small></div>${weightChart()}</div><div class="card card-in"><div class="section-head"><h2>ثبت وزن جدید</h2><span class="chip">BODY PROGRESS</span></div><p class="sub">صبح، ترجیحاً پس از دستشویی و قبل از صبحانه، در شرایط مشابه وزن‌کشی کن. برای قضاوت، میانگین چند روز مهم‌تر از نوسان روزانه است.</p><form id="weightForm" class="record-row"><div class="field-group" style="flex:1"><label class="field-label" for="newWeight">وزن امروز (کیلوگرم)</label><input class="field" type="number" id="newWeight" min="20" max="400" step="0.1" required placeholder="۸۶.۵" value="${escapeHTML(state.weights.find(x=>x.date===today())?.weight||'')}"/></div><div class="field-group" style="flex:1"><label class="field-label" for="newWaist">دور کمر (سانتی‌متر، اختیاری)</label><input class="field" type="number" id="newWaist" min="40" max="220" step="0.5" placeholder="—" value="${escapeHTML(state.weights.find(x=>x.date===today())?.waist||'')}"/></div><button class="btn primary" type="submit">${ic('plus','sm')} ثبت وزن</button></form><div class="food-note">برای جلوگیری از حذف داده‌ها در صورت پاک‌کردن اطلاعات مرورگر یا تعویض گوشی، به‌صورت منظم از تنظیمات خروجی JSON بگیر.</div></div></div>`}
function settingsPage(){return `${pageHeader('YOUR PERSONAL STUDIO','باشگاه رو به سبک خودت بچین.','روزهای تمرین، اهداف تغذیه و اطلاعات شخصی قابل ویرایش هستند.')}<div class="settings-grid"><div class="card settings-card"><h3>${ic('calendar','sm')} چینش روزهای باشگاه</h3><p>هر جلسه رو روی روز دلخواه قرار بده. اگر روزی از قبل اشغال باشه، جای دو جلسه به‌صورت خودکار عوض می‌شه. ترتیب هوشمند تمرین همچنان بر اساس سابقه حفظ می‌شه.</p>${ORDER.map(id=>{const d=Object.keys(state.schedule).find(k=>state.schedule[k]===id);return `<div class="schedule-row"><div class="session-orb">${id}</div><label>${plans[id].title}</label><select class="field" data-schedule="${id}" aria-label="روز جلسه ${id}">${[6,0,1,2,3,4,5].map(x=>`<option value="${x}" ${Number(d)===x?'selected':''}>${dayNames[x]}</option>`).join('')}</select></div>`}).join('')}<div class="tip">${ic('info','sm')} می‌تونی حتی در روز استراحت با انتخاب «بزن بریم» یک جلسه تمرینی رو اجرا کنی.</div></div><div class="card settings-card"><h3>${ic('target','sm')} هدف‌های شخصی</h3><p>اهداف اولیه قابل تنظیم هستند و برنامه غذایی بر اساس عددهای جدید نمایش داده می‌شه.</p><form id="profileForm"><div class="settings-fields">${[['weight','وزن شروع (kg)',20,300,.1],['goal','وزن هدف (kg)',20,300,.1],['calories','هدف کالری روزانه',1000,6000,50],['protein','پروتئین (g)',30,350,5],['carbs','کربوهیدرات (g)',30,600,5],['fat','چربی (g)',15,200,5],['water','آب (لیوان)',1,16,1]].map(([id,label,min,max,step])=>`<div class="field-group"><label class="field-label" for="p_${id}">${label}</label><input class="field" id="p_${id}" type="number" min="${min}" max="${max}" step="${step}" value="${escapeHTML(state.profile[id])}" required/></div>`).join('')}<div class="field-group"><label class="field-label" for="p_timezone">منطقه زمانی</label><select class="field" id="p_timezone"><option value="Asia/Tehran" ${state.profile.timezone==='Asia/Tehran'?'selected':''}>تهران</option><option value="Europe/Berlin" ${state.profile.timezone==='Europe/Berlin'?'selected':''}>
